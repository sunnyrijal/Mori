<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/gozi-mascot.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gozi</title>
    <meta name="description" content="Gozi learns what you own, what you love, and how you're feeling, then suggests exactly what to do with your time." />
    <meta property="og:title" content="Gozi" />
    <meta property="og:description" content="Your personal AI companion for daily activity suggestions based on your mood, inventory, and goals." />
    <meta property="og:image" content="/gozi-mascot.png" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#F7F4EF" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
  <body class="bg-ios-bg text-ios-text   transition-colors duration-300">
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(event) {
        document.body.innerHTML += '<div style="color:red; background:white; padding:20px; z-index:9999; position:absolute; top:0; left:0; width:100%;"><h3 style="margin:0;">JS Error:</h3><pre>' + (event.error ? event.error.stack : event.message) + '</pre></div>';
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML += '<div style="color:red; background:white; padding:20px; z-index:9999; position:absolute; top:0; left:0; width:100%;"><h3 style="margin:0;">Unhandled Promise:</h3><pre>' + (event.reason?.stack || event.reason) + '</pre></div>';
      });
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
